[project]
name = "ha-nanoleaf-ble"
version = "1.0.0"
description = "Home Assistant integration for Nanoleaf Essentials lightstrips over Bluetooth LE"
license = "MIT"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/nanoleaf_ble"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",    # bugbear
  "BLE",  # blind except
  "D",    # docstrings
  "E",
  "F",
  "I",    # isort
  "PL",   # pylint
  "RUF",
  "S",    # bandit
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D202",
  "D203",
  "D213",
  "E501",
  "PLR0911",
  "PLR0912",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR0913", "PLR0917", "PLC0415", "SLF001"]
# The protocol library: timeouts are part of its API, its encoders take one
# argument per wire field, and the app's own nonce/ID choices are not secrets
# (S311: random message ids and CoAP tokens, as the app sends them).
"custom_components/**/lib/*.py" = ["ASYNC109", "PLR0913", "PLR0917", "S311"]
# Command-line tools for working against real hardware.
"scripts/**" = [
  "ASYNC240",
  "BLE001",
  "D",
  "PLC0415",
  "PLR0915",
  "S101",
  "T201",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
