version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # One PR per package: a ruff bump needs a look at new rules and formatting,
    # a harness bump at the Home Assistant it pins, and either can land alone.
    ignore:
      # Test-only requirements of core's usb component: they follow whatever
      # Home Assistant pins, not their own releases.
      - dependency-name: aiousbwatcher
      - dependency-name: serialx
      - dependency-name: pyserial
