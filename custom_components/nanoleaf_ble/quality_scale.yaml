# Home Assistant's Integration Quality Scale, as a checklist for this integration.
# Hassfest only validates this file for core integrations; it is kept by hand.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      The strip pushes nothing, so it is polled over the persistent connection
      (15 s by default, adjustable); a poll costs about 0.6 s of air time.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the protocol library is bundled in lib/.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing themselves; the coordinator owns the connection.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: >-
      The Bluetooth address is the unique id and does not change; a firmware
      update seen in the advertisement updates the entry.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is one strip.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: >-
      Reconfigure changes the credentials (a new setup code or token); the
      address is the unique id and comes from discovery.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each config entry is one strip.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
