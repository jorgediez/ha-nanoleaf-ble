# Home Assistant's Integration Quality Scale, as a checklist for this integration.
# Hassfest only validates this file for core integrations; it is kept by hand.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      The strip pushes nothing, so it is polled over the persistent connection
      (15 s by default, adjustable); a poll costs about 0.6 s of air time.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >-
      The protocol library is bundled in lib/. Its packages come with Home
      Assistant: bleak and bleak-retry-connector with the bluetooth
      integration, listed in the manifest as the minimums the oldest supported
      release ships; cryptography with Home Assistant itself, which hassfest
      does not allow a custom integration to list.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing themselves; the coordinator owns the connection.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: done
    comment: >-
      The unique id is the device ID (EUI-64) in the advertisement, which a
      factory reset keeps. When discovery sees the strip at a new address (a
      factory reset gives it one), the entry follows it; a firmware update seen
      in the advertisement updates the entry too.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is one strip.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: >-
      Reconfigure changes the credentials (a new setup code or token), and
      aborts if a different strip answers at the entry's address. The address
      is not entered by hand: discovery keeps it current.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each config entry is one strip.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
